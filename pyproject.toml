[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "magnetic-points"
version = "0.1.0"
description = "Taxi pickup hotspot (magnetic point) recommendation with recursive K-Means and classification"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "seaborn>=0.12",
  "folium>=0.14",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "haversine>=2.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
